
version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: anomaly_sqlserver
    user: root
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SecurePassword123!
    ports:
      - "1433:1433"
    volumes:
      - sql_audit_data:/var/opt/mssql/audit/
      - ./init-audit.sql:/docker-entrypoint-initdb.d/init-audit.sql
    command: >
      /bin/bash -c "
      mkdir -p /var/opt/mssql/audit;
      chown -R 10001:10001 /var/opt/mssql/audit;
      chmod 770 /var/opt/mssql/audit;
      su -s /bin/bash mssql -c '/opt/mssql/bin/sqlservr' &
      echo 'Esperando a que SQL Server responda...';
      until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SecurePassword123!' -C -Q 'SELECT 1' &> /dev/null; do
        sleep 2;
      done;
      echo 'SQL Server listo. Ejecutando init-audit.sql...';
      /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SecurePassword123!' -C -i /docker-entrypoint-initdb.d/init-audit.sql;
      echo 'Base de datos y auditoría inicializadas correctamente.';
      wait"

  api:
    build:
      context: ..
      dockerfile: OpenSpecTest/Dockerfile
    container_name: openspec_api
    restart: unless-stopped
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SqlAudit: Server=sqlserver,1433;Database=AnomalyTestDb;User Id=sa;Password=SecurePassword123!;TrustServerCertificate=True;
      Ollama__Endpoint: http://host.docker.internal:11434/v1
      Ollama__Model: llama3.2:3b
    ports:
      - "5000:8080"
    volumes:
      - sql_audit_data:/var/opt/mssql/audit:ro

volumes:
  sql_audit_data:
